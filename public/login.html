<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>Iniciar Sesión - SIMAN Mantenimiento</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  
  <!-- Redirigir de inmediato si ya inició sesión previamente -->
  <script>
    (function() {
      try {
        if (window.location.search.indexOf('logout') !== -1) {
          localStorage.removeItem('siman_user');
          localStorage.removeItem('siman_token');
          localStorage.removeItem('siman_mecanico_activo');
          return;
        }
        var userStr = localStorage.getItem('siman_user');
        if (userStr) {
          var user = JSON.parse(userStr);
          if (user && user.rol === 'admin') {
            window.location.replace('/dashboard');
          } else if (user) {
            window.location.replace('/mecanico');
          }
        }
      } catch(e) {}
    })();
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6 relative overflow-hidden">
    
    <!-- Glow decorativo superior -->
    <div class="absolute -top-10 -right-10 w-40 h-40 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Logo & Encabezado -->
    <div class="text-center space-y-2">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center mx-auto shadow-xl shadow-emerald-500/20">
        <i class="fa-solid fa-screwdriver-wrench text-white text-2xl"></i>
      </div>
      <div>
        <h1 class="text-2xl font-extrabold text-white tracking-tight">SIMAN</h1>
        <p class="text-xs text-slate-400">Sistema Integral de Mantenimiento</p>
      </div>
    </div>

    <!-- Formulario Único de Login (Sin auto-registro público) -->
    <form id="form-login" onsubmit="ejecutarLogin(event)" class="space-y-4">
      
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
          Usuario
        </label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-3.5 top-3 text-slate-500 text-xs"></i>
          <input type="text" id="login-username" required placeholder="Tu usuario" autocomplete="username" class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-9 pr-3 py-2.5 text-sm text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
          Contraseña
        </label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-500 text-xs"></i>
          <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password" class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-9 pr-3 py-2.5 text-sm text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
      </div>

      <button type="submit" id="btn-login-submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white font-extrabold text-sm rounded-xl shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i>
        <span>Ingresar al Sistema</span>
      </button>

      <!-- Indicador de conexión con Render Cloud -->
      <div class="flex items-center justify-center gap-2 pt-1 text-[11px] text-slate-400">
        <span id="indicador-servidor-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
        <span id="indicador-servidor-txt">Conectando al servidor...</span>
      </div>

      <p class="text-[11px] text-slate-500 text-center pt-1">
        Acceso restringido. La creación de usuarios es gestionada exclusivamente por el Administrador.
      </p>

    </form>

    <!-- Error / Alerta -->
    <div id="alerta-error" class="hidden bg-rose-950/80 border border-rose-500/50 text-rose-300 text-xs p-3 rounded-xl flex items-center gap-2">
      <i class="fa-solid fa-triangle-exclamation text-rose-400"></i>
      <span id="alerta-error-txt">Usuario o contraseña incorrectos</span>
    </div>

  </div>

  <script>
    // Despertar servidor en segundo plano tan pronto abre la app
    async function verificarEstadoServidor() {
      const dot = document.getElementById('indicador-servidor-dot');
      const txt = document.getElementById('indicador-servidor-txt');
      try {
        const res = await fetch('/api/health');
        if (res.ok) {
          if (dot) dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
          if (txt) txt.innerText = 'Servidor en línea (Render Cloud)';
        }
      } catch(e) {
        if (dot) dot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
        if (txt) txt.innerText = 'Iniciando servidor en la nube...';
        setTimeout(verificarEstadoServidor, 4000);
      }
    }
    verificarEstadoServidor();

    async function ejecutarLogin(e) {
      e.preventDefault();
      ocultarError();

      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value.trim();
      const btn = document.getElementById('btn-login-submit');

      const originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Verificando credenciales...`;

      // Aviso si el servidor en Render tarda en despertar
      const slowTimer = setTimeout(() => {
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Despertando servidor en la nube (primer inicio)...`;
      }, 2500);

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        clearTimeout(slowTimer);

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Credenciales inválidas');

        // Guardar sesión
        localStorage.setItem('siman_token', data.token);
        localStorage.setItem('siman_user', JSON.stringify(data.user));
        localStorage.setItem('siman_mecanico_activo', data.user.nombre);

        // Redirigir según rol
        if (data.user.rol === 'admin') {
          window.location.replace('/dashboard');
        } else {
          window.location.replace('/mecanico');
        }
      } catch (err) {
        clearTimeout(slowTimer);
        const msg = err.message && err.message.includes('Failed to fetch')
          ? 'No se pudo conectar al servidor. Espera unos segundos mientras inicia e intenta de nuevo.'
          : err.message;
        mostrarError(msg);
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }
    }

    function mostrarError(msg) {
      const el = document.getElementById('alerta-error');
      const txt = document.getElementById('alerta-error-txt');
      txt.innerText = msg;
      el.classList.remove('hidden');
    }

    function ocultarError() {
      document.getElementById('alerta-error').classList.add('hidden');
    }

    // Registrar Service Worker para PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(e => console.log('SW no registrado', e));
      });
    }
  </script>
</body>
</html>
