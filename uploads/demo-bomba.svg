<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect x="20" y="20" width="560" height="360" rx="12" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  <!-- Pump icon/drawing -->
  <circle cx="270" cy="190" r="85" fill="url(#metal)" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="270" cy="190" r="45" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <!-- Impeller vanes -->
  <path d="M 270 145 Q 295 165 270 190 Q 245 215 270 235" stroke="#38bdf8" stroke-width="4" fill="none"/>
  <path d="M 225 190 Q 245 215 270 190 Q 295 165 315 190" stroke="#38bdf8" stroke-width="4" fill="none"/>
  <!-- Flanges & Motor shaft -->
  <rect x="350" y="165" width="130" height="50" rx="4" fill="#334155" stroke="#64748b" stroke-width="3"/>
  <rect x="475" y="145" width="20" height="90" rx="4" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
  <rect x="245" y="65" width="50" height="45" rx="4" fill="#334155" stroke="#64748b" stroke-width="3"/>
  <rect x="230" y="50" width="80" height="18" rx="4" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
  <!-- Status badge -->
  <rect x="40" y="40" width="180" height="34" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="58" cy="57" r="6" fill="#34d399"/>
  <text x="74" y="62" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="14" font-weight="700">TRABAJO FINALIZADO</text>
  <!-- Overlay info banner -->
  <rect x="40" y="300" width="520" height="60" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155"/>
  <text x="60" y="325" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Bomba Centrífuga B-102 | Rodamiento y Sellos Nuevos</text>
  <text x="60" y="345" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Mecánico: Carlos Mendoza | Inspección y prueba de presión: 100% OK</text>
</svg>
